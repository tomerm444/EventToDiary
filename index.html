<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b6fd8">
<title>רשמתי</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root { --blue:#3b6fd8; --blue-l:#e8eefb; --bg:#f0f2f5; --card:#fff; --text:#111b21; --muted:#667781; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--blue); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:20px; margin:0; }
  header button { background:none; border:0; color:#fff; font-size:22px; padding:4px 8px; }
  main { padding:16px; max-width:640px; margin:auto; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .btn { background:var(--blue); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-size:16px; }
  .btn.light { background:var(--blue-l); color:var(--blue); }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input, select, textarea { font:inherit; }
  input[type=text], input[type=password], input[type=date], input[type=time], select, textarea {
    width:100%; padding:9px 10px; font-size:16px; border:1px solid #ccd; border-radius:8px; background:#fff; }
  #key, #model { direction:ltr; }
  textarea { min-height:90px; resize:vertical; }
  .spinner { width:42px; height:42px; border:4px solid #dfe7f8; border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite; margin:10px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .center { text-align:center; }
  .err { color:#b00020; }
  .hidden { display:none !important; }
  .muted { color:var(--muted); font-size:14px; line-height:1.5; }
  h2 { font-size:16px; color:var(--muted); margin:20px 4px 8px; }
  a { color:var(--blue); }
  .thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .thumbs img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid #dde; }
  .source { font-size:14px; color:var(--muted); white-space:pre-wrap; max-height:4.5em; overflow:hidden; }
  .event { border-right:5px solid var(--blue); }
  .event.added { border-right-color:#2e9d5b; }
  .event .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .event .grid label { margin:6px 0 2px; font-size:13px; color:var(--muted); font-weight:500; }
  .event .full { grid-column:1 / -1; }
  .event .title { font-size:18px; font-weight:700; }
  .check { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); margin-top:8px; }
  .done { color:#2e9d5b; font-weight:600; font-size:14px; }
  .hist { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .hist .t { font-weight:600; }
  .icon { background:none; border:0; font-size:18px; padding:4px 8px; }
  .info { direction:ltr; font-size:11px; color:var(--muted); margin-top:4px; text-align:left; }
  .usage { font-size:12px; opacity:.85; margin-inline-start:auto; margin-inline-end:6px; }
</style>
</head>
<body>
<header>
  <h1>📅 רשמתי</h1>
  <span id="usage" class="usage"></span>
  <button id="settingsBtn" aria-label="הגדרות">⚙️</button>
</header>
<main>
  <section id="settings" class="card hidden">
    <b>הגדרות</b>
    <label for="key">מפתח Gemini API</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <p class="muted" id="keyHint">אפשר להשתמש באותו מפתח של "תמלול". מקבלים מפתח בחינם ב-<a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>.</p>
    <label for="model">מודל</label>
    <select id="model"><option value="auto">אוטומטי (מומלץ)</option></select>
    <label>שימוש במכסה</label>
    <div class="muted" id="usageDetails" style="font-size:13px"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="saveBtn">שמירה</button>
      <button class="btn light" id="closeBtn">סגירה</button>
    </div>
  </section>

  <section id="input" class="card">
    <p class="muted" style="margin-top:0">
      משתפים לכאן הודעה, צילום של דף/הזמנה או צילום מסך ← בוחרים "רשמתי". או מדביקים טקסט / בוחרים תמונה:
    </p>
    <textarea id="text" placeholder="הדביקו כאן הודעה..."></textarea>
    <div class="thumbs" id="pickedThumbs"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn light" id="pasteBtn">📋 הדבקה</button>
      <label class="btn light" style="margin:0;font-weight:normal">📷 תמונה
        <input type="file" id="imgPick" accept="image/*" multiple class="hidden">
      </label>
      <button class="btn" id="goBtn" style="margin-inline-start:auto">חילוץ אירועים</button>
    </div>
  </section>

  <section id="status" class="card center hidden"></section>
  <section id="results"></section>

  <h2 id="histTitle" class="hidden">אחרונים</h2>
  <div id="history"></div>
</main>

<script>
// ---------- daily request counter (shared by "תמלול" and "רשמתי": same site → same Google quota) ----------
// Google resets the daily quota at midnight Pacific time (10:00 in Israel) and doesn't report what's left,
// so we count the requests ourselves; when a daily-quota error arrives we remember after how many it happened.
const pacificDay = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date());
function usage() {
  let u; try { u = JSON.parse(localStorage.getItem('gemini-usage')); } catch {}
  return u && u.day === pacificDay() ? u : { day: pacificDay(), count: 0, models: {} };
}
function knownLimits() { try { return JSON.parse(localStorage.getItem('gemini-limits')) || {}; } catch { return {}; } }
function countRequest(model) {
  const u = usage(); u.count++; u.models[model] = (u.models[model] || 0) + 1;
  try { localStorage.setItem('gemini-usage', JSON.stringify(u)); } catch {}
  renderUsage();
}
function noteDailyLimit(model) {
  const n = usage().models[model]; if (!n) return;
  const l = knownLimits(); l[model] = { n, day: pacificDay() };
  try { localStorage.setItem('gemini-limits', JSON.stringify(l)); } catch {}
  renderUsage();
}
function renderUsage() {
  const u = usage(), b = document.getElementById('usage'), d = document.getElementById('usageDetails');
  if (b) { b.textContent = u.count ? `היום: ${u.count} בקשות` : ''; b.title = 'נספר בשתי האפליקציות; מתאפס ב-10:00'; }
  if (!d) return;
  const lim = knownLimits(), names = [...new Set([...Object.keys(u.models), ...Object.keys(lim)])];
  d.innerHTML = '';
  if (!names.length) { d.textContent = 'עוד לא נשלחו בקשות היום.'; return; }
  const top = document.createElement('div'); top.textContent = `סה"כ היום (בשתי האפליקציות): ${u.count}. מתאפס כל יום ב-10:00.`; d.append(top);
  for (const m of names) {
    const row = document.createElement('div'); row.style.direction = 'ltr'; row.style.textAlign = 'left';
    row.textContent = `${m}: ${u.models[m] || 0}` + (lim[m] ? ` / ~${lim[m].n} (daily limit measured ${lim[m].day})` : '');
    d.append(row);
  }
}
window.addEventListener('storage', e => { if (e.key === 'gemini-usage' || e.key === 'gemini-limits') renderUsage(); });

// ===================== basics =====================
const $ = id => document.getElementById(id);
const P = 'yoman:';     // localStorage prefix: this app shares its origin with other apps on the same github.io site
const store = {
  get(k, d) { try { const v = localStorage.getItem(P + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(P + k, v); } catch {} }
};
const getKey = () => store.get('apiKey', '') || (() => { try { return localStorage.getItem('apiKey') || ''; } catch { return ''; } })();  // falls back to "תמלול"'s key
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function status(html) { $('status').innerHTML = html; $('status').classList.remove('hidden'); }
function hideStatus() { $('status').classList.add('hidden'); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ===================== settings =====================
renderUsage();
function openSettings() {
  renderUsage();
  $('key').value = store.get('apiKey', '') || getKey();
  $('settings').classList.remove('hidden');
  fillModelSelect();
}
$('settingsBtn').onclick = () => $('settings').classList.contains('hidden') ? openSettings() : $('settings').classList.add('hidden');
$('closeBtn').onclick = () => $('settings').classList.add('hidden');
$('saveBtn').onclick = () => {
  store.set('apiKey', $('key').value.trim());
  store.set('model', $('model').value || 'auto');
  store.set('modelList', ''); store.set('lastGoodModel', ''); store.set('badModels', '[]');
  $('settings').classList.add('hidden');
  if (pendingInput) { const p = pendingInput; pendingInput = null; extract(p); }
};
async function listModels(key) {
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', { headers: { 'x-goog-api-key': key } });
  const j = await r.json();
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, '')).filter(n => /^gemini/.test(n) && !/(image|tts|embed|live|robotics|computer|audio)/i.test(n));
}
const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0);
async function fillModelSelect() {
  const sel = $('model'), cur = store.get('model', 'auto'), key = getKey();
  const set = names => {
    sel.innerHTML = ''; sel.append(new Option('אוטומטי (מומלץ)', 'auto'));
    names.forEach(n => sel.append(new Option(n, n)));
    if (cur !== 'auto' && !names.includes(cur)) sel.append(new Option(cur, cur));
    sel.value = cur;
  };
  set([]);
  if (!key) return;
  try {
    const rank = n => n.includes('lite') ? 1 : n.includes('flash') ? 0 : n.includes('pro') ? 2 : 3;
    set((await listModels(key)).sort((a, b) => rank(a) - rank(b) || ver(b) - ver(a) || a.localeCompare(b)));
  } catch {}
}

// ===================== model selection (same approach as "תמלול") =====================
const badModels = () => { try { return JSON.parse(store.get('badModels', '[]')); } catch { return []; } };
const markBad = m => { const b = badModels(); if (!b.includes(m)) { b.push(m); store.set('badModels', JSON.stringify(b)); } };
const coolMap = () => { try { return JSON.parse(store.get('cooldown', '{}')); } catch { return {}; } };
const coolDown = (m, min) => { const c = coolMap(); c[m] = Date.now() + min * 60000; store.set('cooldown', JSON.stringify(c)); };
async function candidateModels(key) {
  const chosen = store.get('model', 'auto');
  const manual = chosen !== 'auto' ? [chosen] : [];
  let list = [];
  try { const c = JSON.parse(store.get('modelList', 'null')); if (c && Date.now() - c.ts < 864e5) list = c.list; } catch {}
  if (!list.length) {
    try {
      const ok = (await listModels(key)).filter(n => /^gemini-\d/.test(n) && /(flash|pro)/.test(n) && !/(lite|exp|thinking|learnlm|customtools)/i.test(n));
      const flash = ok.filter(n => n.includes('flash')).sort((a, b) => ver(b) - ver(a));
      const pro = ok.filter(n => n.includes('pro')).sort((a, b) => ver(b) - ver(a));
      list = [...flash.slice(0, 3), 'gemini-flash-latest', ...pro.slice(0, 2)];
      if (ok.length) store.set('modelList', JSON.stringify({ ts: Date.now(), list }));
    } catch {}
  }
  if (!list.length) list = ['gemini-flash-latest', 'gemini-pro-latest'];
  const last = store.get('lastGoodModel', ''), bad = badModels();
  const all = [...new Set([...manual, ...(last ? [last] : []), ...list])].filter(m => manual.includes(m) || !bad.includes(m));
  const cool = coolMap(), now = Date.now(), ready = all.filter(m => !(cool[m] > now));
  return ready.length ? [...ready, ...all.filter(m => cool[m] > now)] : all;
}

// ===================== Gemini call =====================
const TIMEOUT_MS = 30000;
const SCHEMA = {
  type: 'OBJECT',
  properties: {
    events: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      title: { type: 'STRING' }, date: { type: 'STRING' }, end_date: { type: 'STRING' },
      start_time: { type: 'STRING' }, end_time: { type: 'STRING' }, all_day: { type: 'BOOLEAN' },
      location: { type: 'STRING' }, notes: { type: 'STRING' }
    }, required: ['title', 'date'] } },
    no_events_reason: { type: 'STRING' }
  },
  required: ['events']
};
function buildPrompt(now) {
  const wd = new Intl.DateTimeFormat('he-IL', { weekday: 'long' }).format(now);
  return `אתה עוזר שמחלץ אירועים ליומן מהודעות, הזמנות, מכתבים מבית הספר וצילומי מסך (בדרך כלל בעברית).
היום: ${wd}, ${isoDate(now)} (שעון ישראל). חשב תאריכים יחסיים ("מחר", "ביום שלישי", "בשבוע הבא") ביחס להיום.
אם לא צוינה שנה — התאריך הקרוב הבא. "ביום X" בלי פירוט = ה-X הקרוב (לא היום עצמו).
לכל אירוע החזר:
- title: כותרת קצרה וברורה בעברית שמבינים ממנה במבט אחד במה מדובר (למשל "יום הולדת לנועה", "אסיפת הורים — כיתה ב'").
- date: YYYY-MM-DD. end_date רק לאירוע של כמה ימים.
- start_time / end_time: HH:MM (24 שעות). "בשש בערב" = 18:00. אם השעה לא ברורה מההקשר בין בוקר לערב, בחר את הסביר. אם אין שעה בכלל — all_day=true והשאר ריק.
- location: כתובת או מקום, אם צוינו.
- notes: פרטים חשובים בקצרה — מה להביא, עלות, איש קשר/טלפון, קוד לבוש, דדליין לאישור הגעה.
דדליין (כמו "לשלם עד יום חמישי" או "לאשר הגעה עד 5.12") הוא אירוע נפרד של יום שלם עם כותרת שמתחילה ב"להספיק:".
חשוב מאוד: כשיש תמונה (הזמנה, מודעה, מכתב, צילום מסך) — קרא את כל הטקסט שבה בעיון, כולל אותיות קטנות, אייקונים של שעון/לוח שנה/מיקום וטקסט בצדדים.
הפרטים החשובים (שעה, מקום, כתובת, מה להביא) מופיעים לרוב בתמונה ולא בהודעה שנשלחה איתה.
אם אותו אירוע מוזכר גם בהודעה וגם בתמונה — זה אירוע אחד: שלב את כל הפרטים משניהם, ואל תשאיר שדה ריק אם המידע מופיע באחד מהם.
אל תמציא אירועים. אם אין אירועים, החזר רשימה ריקה והסבר קצר ב-no_events_reason.`;
}
async function callGemini(model, key, parts, { schema = true, thinking = true, hiRes = true, signal } = {}) {
  const gen = { responseMimeType: 'application/json' };
  if (hiRes && parts.some(p => p.inline_data)) gen.mediaResolution = 'MEDIA_RESOLUTION_HIGH';   // small text on invitations
  if (schema) gen.responseSchema = SCHEMA;
  if (/gemini-3/.test(model)) { if (thinking) gen.thinkingConfig = { thinkingLevel: 'low' }; } else gen.temperature = 0;
  const ctrl = new AbortController();
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, TIMEOUT_MS);
  const onAbort = () => ctrl.abort(); signal?.addEventListener('abort', onAbort);
  try {
    countRequest(model);
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ parts }], generationConfig: gen })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = j.error?.message || ('HTTP ' + r.status);
      const o = { schema, thinking, hiRes, signal };
      if (r.status === 400 && thinking && gen.thinkingConfig && /think/i.test(msg)) return callGemini(model, key, parts, { ...o, thinking: false });
      if (r.status === 400 && hiRes && gen.mediaResolution && /resolution/i.test(msg)) return callGemini(model, key, parts, { ...o, hiRes: false });
      if (r.status === 400 && schema && /schema|response_schema|responseSchema/i.test(msg)) return callGemini(model, key, parts, { ...o, schema: false });
      const det = j.error?.details || [];
      const ri = det.find(d => /RetryInfo/.test(d['@type'] || ''));
      const daily = det.some(d => /QuotaFailure/.test(d['@type'] || '') && (d.violations || []).some(v => /PerDay/i.test(v.quotaId || '')));
      throw Object.assign(new Error(msg), { status: r.status, retryAfter: ri ? parseFloat(ri.retryDelay) : null, daily });
    }
    const raw = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    let data;
    try { data = JSON.parse(raw); } catch { const m = raw.match(/\{[\s\S]*\}/); data = m ? JSON.parse(m[0]) : null; }
    if (!data || !Array.isArray(data.events)) throw new Error('bad response: ' + raw.slice(0, 100));
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw Object.assign(new Error(timedOut ? `timeout (${model})` : 'cancelled'), { status: timedOut ? 504 : 0, timeout: timedOut, cancelled: !timedOut });
    throw e;
  } finally { clearTimeout(timer); signal?.removeEventListener('abort', onAbort); }
}

// ===================== images: shrink big photos before sending (faster upload) =====================
async function imagePart(file) {
  let blob = file, type = file.type || 'image/jpeg';
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    if (scale < 1 || file.size > 3e6) {
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)); type = 'image/jpeg';
    }
  } catch {}   // unsupported format for canvas (e.g. HEIC) → send as is
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
  return { inline_data: { mime_type: type, data } };
}

// ===================== extraction flow =====================
let pendingInput = null;
async function extract(input, autoTries = 0) {
  const key = getKey();
  if (!key) { pendingInput = input; status('צריך להגדיר מפתח API פעם אחת (אפשר את אותו מפתח של "תמלול").'); openSettings(); return; }
  if (!input.text.trim() && !input.images.length) { status('<div class="err">אין טקסט או תמונה לעבד.</div>'); return; }
  $('results').innerHTML = '';
  const t0 = Date.now();
  status('<div class="spinner"></div>מחפש אירועים... <span id="secs">0</span> שנ׳<div class="muted" id="mdl" style="direction:ltr"></div>');
  const tick = setInterval(() => { const s = $('secs'); if (s) s.textContent = Math.round((Date.now() - t0) / 1000); }, 1000);
  const diag = [];
  try {
    const parts = [{ text: buildPrompt(new Date()) }];
    const imgKB = [];
    for (const img of input.images) { const ip = await imagePart(img); imgKB.push(Math.round(ip.inline_data.data.length * 0.75 / 1024)); parts.push(ip); }
    if (input.images.length) parts.push({ text: `למעלה ${input.images.length > 1 ? input.images.length + ' תמונות' : 'תמונה'} — קרא את כל הפרטים שבה.` });
    if (input.text.trim()) parts.push({ text: (input.images.length ? 'ההודעה שנשלחה עם התמונה:\n' : 'התוכן:\n') + input.text.trim() });
    let data, used, quota = [];
    const models = await candidateModels(key);
    const isKeyErr = e => e.status === 401 || e.status === 403 || (e.status === 400 && /api key/i.test(e.message));
    async function runModel(model, signal) {
      const ts = Date.now();
      try {
        try { return await callGemini(model, key, parts, { signal }); }
        catch (e) { if (!(e.status >= 500 && !e.timeout) || signal.aborted) throw e; await new Promise(r => setTimeout(r, 2000)); return await callGemini(model, key, parts, { signal }); }
      } catch (e) {
        if (!e.cancelled) {
          diag.push(`${model} (${Math.round((Date.now() - ts) / 1000)}s): ${e.status || ''} ${String(e.message).slice(0, 110)}`);
          if (/no longer available|not found|not supported|deprecated/i.test(e.message) && (e.status === 404 || e.status === 400)) markBad(model);
          if (e.status === 429 && e.daily) noteDailyLimit(model);
          if (e.status === 429) { quota.push(e); coolDown(model, e.daily ? 360 : Math.max(1, (e.retryAfter || 60) / 60)); }
          else if (e.timeout) coolDown(model, 5);
        }
        throw e;
      }
    }
    // First two candidates race in parallel (until one model has proven itself); the first answer wins.
    const queue = [...models];
    while (!data && queue.length) {
      const race = queue.length === models.length && !store.get('lastGoodModel', '');
      const batch = queue.splice(0, race ? 2 : 1);
      const m = $('mdl'); if (m) m.textContent = batch.join(' / ');
      const ctrl = new AbortController();
      try {
        [data, used] = await Promise.any(batch.map(md => runModel(md, ctrl.signal).then(d => [d, md])));
        ctrl.abort();
        store.set('lastGoodModel', used);
      } catch (agg) {
        const errs = (agg.errors || [agg]).filter(e => !e.cancelled);
        const ke = errs.find(isKeyErr); if (ke) throw Object.assign(ke, { keyErr: true });
        if (batch.includes(store.get('lastGoodModel', ''))) store.set('lastGoodModel', '');
      }
    }
    clearInterval(tick);
    if (!data) {
      // every model hit the per-minute quota → wait and try again by itself
      if (quota.length && !quota.every(q => q.daily) && autoTries < 2) {
        const waits = quota.map(q => q.retryAfter).filter(x => x > 0);
        let s = Math.min(Math.max(Math.ceil(waits.length ? Math.min(...waits) : 30), 5), 90), cancelled = false;
        for (; s > 0 && !cancelled; s--) {
          status(`<div class="spinner"></div>הגעתם למכסת הבקשות לדקה.<br>ממשיך אוטומטית בעוד <b>${s}</b> שניות...<div class="row" style="justify-content:center;margin-top:10px"><button class="btn light" id="stopAuto">ביטול</button></div>`);
          $('stopAuto').onclick = () => { cancelled = true; };
          await new Promise(r => setTimeout(r, 1000));
        }
        if (!cancelled) { store.set('cooldown', '{}'); return extract(input, autoTries + 1); }
      }
      const e = new Error('no model answered');
      e.friendly = quota.length && quota.every(q => q.daily) ? 'נגמרה המכסה החינמית היומית. היא מתחדשת מחר (או מיד, אם מחברים חיוב).'
                 : quota.length ? 'הגעתם למכסת השימוש החינמית לעכשיו. נסו שוב בעוד כמה דקות.' : 'לא הצלחתי לקבל תשובה מגוגל.';
      throw e;
    }
    hideStatus();
    const secs = Math.round((Date.now() - t0) / 1000);
    const rec = {
      ts: Date.now(),
      source: input.text.trim().slice(0, 400) || (input.images.length ? `📷 ${input.images.length} תמונות` : ''),
      events: data.events.map(normalizeEvent),
      reason: data.no_events_reason || '',
      info: `${used} · ${secs}s` + (imgKB.length ? ` · 📷 ${imgKB.map(k => k + 'KB').join(', ')}` : '')
    };
    if (rec.events.length) { const h = loadHistory(); h.unshift(rec); saveHistory(h); }
    showResult(rec, input.images);
    $('text').value = ''; picked = []; renderPicked();
  } catch (e) {
    clearInterval(tick);
    pendingInput = input;
    const friendly = e.keyErr ? 'בעיה במפתח ה-API. בדקו אותו בהגדרות (⚙️).' : e.friendly || 'משהו השתבש.';
    status(`<div class="err">${friendly}</div><div class="info">${(diag.length ? diag : [String(e.message)]).map(s => s.replace(/</g, '&lt;')).join('<br>')}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="retryBtn">נסה שוב</button></div>`);
    $('retryBtn').onclick = () => { const p = pendingInput; pendingInput = null; extract(p); };
  }
}
function normalizeEvent(ev) {
  const t = s => (/^\d{1,2}:\d{2}$/.test(s || '') ? s.padStart(5, '0') : '');
  const d = s => (/^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s : '');
  const start = t(ev.start_time);
  return {
    title: (ev.title || 'אירוע').trim(), date: d(ev.date) || isoDate(new Date()), end_date: d(ev.end_date),
    start_time: start, end_time: start ? t(ev.end_time) : '', all_day: !start,
    location: (ev.location || '').trim(), notes: (ev.notes || '').trim(), added: false
  };
}

// ===================== calendar links =====================
const compact = s => s.replace(/-/g, '');
function addMinutes(date, time, min) { const d = new Date(`${date}T${time}:00`); d.setMinutes(d.getMinutes() + min); return d; }
const stamp = d => `${isoDate(d).replace(/-/g, '')}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function eventRange(ev) {
  if (ev.all_day || !ev.start_time) {
    const last = new Date(`${ev.end_date || ev.date}T00:00:00`); last.setDate(last.getDate() + 1);
    return { allDay: true, start: compact(ev.date), end: isoDate(last).replace(/-/g, '') };
  }
  const st = new Date(`${ev.date}T${ev.start_time}:00`);
  let en = ev.end_time ? new Date(`${ev.end_date || ev.date}T${ev.end_time}:00`) : addMinutes(ev.date, ev.start_time, 60);
  if (en <= st) en = addMinutes(ev.date, ev.start_time, 60);
  return { allDay: false, start: stamp(st), end: stamp(en) };
}
function googleUrl(ev) {
  const r = eventRange(ev);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    `&text=${encodeURIComponent(ev.title)}&dates=${r.start}/${r.end}&ctz=Asia/Jerusalem` +
    (ev.location ? `&location=${encodeURIComponent(ev.location)}` : '') +
    (ev.notes ? `&details=${encodeURIComponent(ev.notes)}` : '');
}
function icsFile(ev) {
  const r = eventRange(ev);
  const esc = s => s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//yoman//he', 'BEGIN:VEVENT',
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@yoman`, `DTSTAMP:${stamp(new Date())}`,
    r.allDay ? `DTSTART;VALUE=DATE:${r.start}` : `DTSTART;TZID=Asia/Jerusalem:${r.start}`,
    r.allDay ? `DTEND;VALUE=DATE:${r.end}` : `DTEND;TZID=Asia/Jerusalem:${r.end}`,
    `SUMMARY:${esc(ev.title)}`];
  if (ev.location) lines.push(`LOCATION:${esc(ev.location)}`);
  if (ev.notes) lines.push(`DESCRIPTION:${esc(ev.notes)}`);
  lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc(ev.title)}`, r.allDay ? 'TRIGGER:-PT15H' : 'TRIGGER:-PT1H', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
  return new Blob([lines.join('\r\n')], { type: 'text/calendar' });
}
function downloadIcs(ev) {
  const a = el('a'); a.href = URL.createObjectURL(icsFile(ev)); a.download = (ev.title.replace(/[\\/:*?"<>|]/g, '') || 'event') + '.ics';
  document.body.append(a); a.click(); a.remove();
}

// ===================== event cards (editable before adding) =====================
const dayName = iso => new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' }).format(new Date(iso + 'T12:00:00'));
function eventCard(ev, onChange) {
  const c = el('div', 'card event' + (ev.added ? ' added' : ''));
  const field = (labelText, input, full) => { const w = el('div', full ? 'full' : ''); w.append(el('label', null, labelText), input); return w; };
  const inp = (type, val) => { const i = el('input'); i.type = type; i.value = val || ''; return i; };
  const title = inp('text', ev.title); title.classList.add('title');
  const date = inp('date', ev.date), start = inp('time', ev.start_time), end = inp('time', ev.end_time);
  const loc = inp('text', ev.location);
  const notes = el('textarea'); notes.value = ev.notes; notes.style.minHeight = '60px';
  const dayLbl = el('div', 'muted', dayName(ev.date));
  const allDayBox = el('input'); allDayBox.type = 'checkbox'; allDayBox.checked = ev.all_day;
  const allDay = el('label', 'check'); allDay.append(allDayBox, 'כל היום');
  const grid = el('div', 'grid');
  grid.append(field('כותרת', title, true), field('תאריך', date), field('יום', dayLbl), field('התחלה', start), field('סיום', end),
              field('מקום', loc, true), field('פרטים', notes, true));
  dayLbl.style.paddingTop = '8px';
  const sync = () => {
    Object.assign(ev, { title: title.value.trim() || 'אירוע', date: date.value || ev.date, start_time: allDayBox.checked ? '' : start.value,
                        end_time: allDayBox.checked ? '' : end.value, location: loc.value.trim(), notes: notes.value.trim(),
                        all_day: allDayBox.checked || !start.value });
    dayLbl.textContent = dayName(ev.date);
    start.disabled = end.disabled = allDayBox.checked;
    onChange?.();
  };
  [title, date, start, end, loc, notes, allDayBox].forEach(i => i.addEventListener('change', sync));
  start.disabled = end.disabled = ev.all_day;
  const done = el('span', 'done', ev.added ? '✓ נוסף' : '');
  const add = el('button', 'btn', '📅 הוספה ליומן גוגל');
  add.onclick = () => { sync(); window.open(googleUrl(ev), '_blank'); ev.added = true; c.classList.add('added'); done.textContent = '✓ נפתח ביומן'; onChange?.(); };
  const ics = el('button', 'btn light', 'יומן אחר (.ics)');
  ics.onclick = () => { sync(); downloadIcs(ev); ev.added = true; c.classList.add('added'); done.textContent = '✓ הקובץ ירד'; onChange?.(); };
  const row = el('div', 'row'); row.style.marginTop = '12px'; row.append(add, ics, done);
  c.append(grid, allDay, row);
  return c;
}
function showResult(rec, images = []) {
  const box = $('results'); box.innerHTML = '';
  const src = el('div', 'card');
  src.append(el('div', 'muted', rec.events.length ? `נמצאו ${rec.events.length} אירועים — בדקו, תקנו אם צריך, והוסיפו ליומן:` : 'לא נמצאו אירועים.'));
  if (!rec.events.length && rec.reason) src.append(el('div', 'muted', rec.reason));
  if (rec.source && !rec.source.startsWith('📷')) { const s = el('div', 'source', rec.source); s.style.marginTop = '8px'; src.append(s); }
  if (images.length) { const th = el('div', 'thumbs'); images.forEach(f => { const i = el('img'); i.src = URL.createObjectURL(f); th.append(i); }); src.append(th); }
  src.append(el('div', 'info', rec.info || ''));
  box.append(src);
  rec.events.forEach(ev => box.append(eventCard(ev, () => { updateRecord(rec); renderHistory(); })));
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  renderHistory();
}

// ===================== history =====================
const loadHistory = () => { try { return JSON.parse(store.get('history', '[]')); } catch { return []; } };
const saveHistory = h => store.set('history', JSON.stringify(h.slice(0, 30)));
const updateRecord = rec => saveHistory(loadHistory().map(r => r.ts === rec.ts ? rec : r));
function renderHistory() {
  const h = loadHistory();
  $('history').innerHTML = '';
  $('histTitle').classList.toggle('hidden', !h.length);
  for (const rec of h) {
    const c = el('div', 'card hist');
    const left = el('div');
    const first = rec.events[0];
    left.append(el('div', 't', rec.events.map(e => e.title).join(' · ')),
                el('div', 'muted', (first ? dayName(first.date) + (first.start_time ? ' ' + first.start_time : '') : '') +
                                   (rec.events.length > 1 ? ` (+${rec.events.length - 1})` : '') +
                                   (rec.events.every(e => e.added) ? ' · ✓' : '')));
    const open = el('button', 'icon', '↩️'); open.setAttribute('aria-label', 'פתיחה'); open.onclick = () => showResult(rec);
    const del = el('button', 'icon', '🗑'); del.setAttribute('aria-label', 'מחיקה');
    del.onclick = () => { saveHistory(loadHistory().filter(r => r.ts !== rec.ts)); renderHistory(); };
    const btns = el('div', 'row'); btns.append(open, del);
    c.append(left, btns); $('history').append(c);
  }
}

// ===================== manual input =====================
let picked = [];
function renderPicked() {
  $('pickedThumbs').innerHTML = '';
  picked.forEach(f => { const i = el('img'); i.src = URL.createObjectURL(f); $('pickedThumbs').append(i); });
}
$('imgPick').onchange = e => { picked.push(...e.target.files); e.target.value = ''; renderPicked(); };
$('pasteBtn').onclick = async () => {
  try { const t = await navigator.clipboard.readText(); if (t) $('text').value = ($('text').value ? $('text').value + '\n' : '') + t; }
  catch { $('text').focus(); status('<div class="muted">לחצו לחיצה ארוכה בתיבה ובחרו "הדבק".</div>'); setTimeout(hideStatus, 2500); }
};
$('goBtn').onclick = () => extract({ text: $('text').value, images: [...picked] });

// ===================== startup =====================
(async () => {
  renderHistory();
  if (new URLSearchParams(location.search).get('shared')) {
    history.replaceState(null, '', './');
    const cache = await caches.open('yoman-shared');
    let text = '', images = [];
    for (const req of await cache.keys()) {
      const resp = await cache.match(req);
      if (req.url.endsWith('shared-text')) text = await resp.text();
      else images.push(new File([await resp.arrayBuffer()], 'image', { type: resp.headers.get('Content-Type') || 'image/jpeg' }));
      await cache.delete(req);
    }
    if (text || images.length) { $('text').value = text; extract({ text, images }); }
    else status('<div class="err">לא התקבל תוכן. נסו לשתף שוב.</div>');
  } else if (!getKey()) openSettings();
})();
</script>
